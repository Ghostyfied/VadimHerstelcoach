<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Herstelcoach concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Herstelcoach concept, rustige versie.
   Kleur volgens 60-30-10: wit vlak, neutrale grijzen voor tekst en lijnen, één accentkleur voor actie en selectie.
   Statuskleuren (oranje, rood, groen) alleen waar iets betekenis heeft: stilvallen, meer pijn, online.
   HUISSTIJL FYSIOFABRIEK: --brand, --brand-ink en --brand-soft zijn plaatshouders. Vervang ze door de echte waarden. */
:root{
  --brand:#0F5F66; --brand-ink:#0B4A50; --brand-soft:#EEF5F5; --brand-tint:#DDEBEC; --on-brand:#FFFFFF;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F6F7; --surface-3:#E9EBEE; --line:#E7E9EC;
  --ink:#1C2126; --ink-2:#4A535C; --ink-3:#646C75;
  --brand-2:var(--brand); --data:var(--brand); --data-fill:rgba(15,95,102,.07); --grid:#EEF0F2;
  --good:#067647; --good-soft:#ECFDF3; --warn:#B54708; --warn-soft:#FFF8EB; --crit:#B42318; --crit-soft:#FEF3F2;
  --badge:var(--brand); --on-badge:#FFFFFF;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow:0 12px 32px rgba(16,24,40,.10);
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:var(--f-body);
  --r-s:8px; --r-m:12px; --r-l:16px;
  color-scheme:light;
}
@supports (color:color-mix(in srgb,red 50%,white)){
  :root{--brand-ink:color-mix(in srgb,var(--brand) 80%,black);--brand-soft:color-mix(in srgb,var(--brand) 7%,white);--brand-tint:color-mix(in srgb,var(--brand) 14%,white);--data-fill:color-mix(in srgb,var(--brand) 7%,transparent)}
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-body);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance;line-height:1.25}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.app{min-height:100%;display:flex;flex-direction:column}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .word{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand .ver{font-size:13px;color:var(--ink-3)}
.switch{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;margin-left:auto}
.switch button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:500;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
.switch .who{font-size:12px;font-weight:400;color:var(--ink-3)}

/* Guide */
.guide{margin:16px 20px 0;background:var(--surface-2);border-radius:var(--r-m);padding:14px 16px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;color:var(--ink-2);font-size:14px}
.guide ol{margin:0;padding-left:20px;display:grid;gap:4px;flex:1;min-width:240px}
.guide strong{font-weight:600;color:var(--ink)}
.guide .x{border:0;background:transparent;color:var(--ink-3);font-weight:500;padding:2px 6px;border-radius:6px}
.guide .x:hover{color:var(--ink)}
.guide .lead{font-weight:600;color:var(--ink);font-size:15px;min-width:140px}

/* Buttons, chips, badges */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;line-height:1.2;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand);padding-left:8px;padding-right:8px}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%;justify-content:center;padding:13px 14px;font-size:15px;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:transparent;color:var(--good);padding:0}
.chip.warn{background:transparent;color:var(--warn);padding:0}
.chip.crit{background:transparent;color:var(--crit);padding:0}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.tape{font-size:13px;font-weight:600;color:var(--ink-3)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--badge);color:var(--on-badge);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ico{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:4px 11px;font-weight:500;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}

/* Fysio layout */
.fysio{flex:1;display:grid;grid-template-columns:84px 340px minmax(0,1fr);min-height:0}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding:14px 10px;gap:4px}
.rail button{border:0;background:transparent;border-radius:10px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:500;color:var(--ink-3)}
.rail button:hover{color:var(--ink)}
.rail button[aria-current="page"]{color:var(--brand);background:var(--brand-soft);font-weight:600}
.rail .ico{width:22px;height:22px}
.list{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.list-head{padding:20px 16px 8px;display:grid;gap:12px}
.list-head h2{font-size:22px}
.search{width:100%;border:0;background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:14px}
.search::placeholder{color:var(--ink-3)}
.filters{display:flex;gap:2px;background:var(--surface-2);border-radius:10px;padding:3px}
.filters button{flex:auto;border:0;background:transparent;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:500;color:var(--ink-2);display:inline-flex;gap:5px;align-items:center;justify-content:center;white-space:nowrap}
.filters button .num{color:var(--ink-3)}
.filters button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
.rows{overflow:auto;flex:1;padding-bottom:12px}
.row{width:100%;border:0;background:transparent;text-align:left;padding:12px 16px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;position:relative}
.row::after{content:"";position:absolute;left:68px;right:0;bottom:0;height:1px;background:var(--line)}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--brand-soft)}
.row[aria-current="true"]::after,.row:hover::after{background:transparent}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--surface-2);color:var(--ink-2)}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.row .when{font-size:12px;color:var(--ink-3);white-space:nowrap}
.row .flag{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:4px;margin-top:3px}
.row .flag .ico{width:14px;height:14px}
.row .flag.warn{color:var(--warn)} .row .flag.crit{color:var(--crit)}
.group-label{padding:16px 16px 4px;font-size:13px;font-weight:600;color:var(--ink-3)}

.detail{min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.d-head{padding:22px 28px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.d-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.d-top .av{width:48px;height:48px;font-size:17px}
.d-top h2{font-size:24px}
.d-sub{margin:2px 0 0;color:var(--ink-3);font-size:14px}
.d-top>div:not(.d-actions){flex:1 1 320px;min-width:0}
.d-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:24px;margin-top:18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 0;font-weight:500;font-size:14.5px;color:var(--ink-3);border-bottom:2px solid transparent;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--brand)}
.d-body{padding:24px 28px 40px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:20px;min-height:0}
.d-body>*{flex:none}
.back{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 20px;min-width:0}
.panel h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3 .r{margin-left:auto;font-weight:400}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px 24px}
.fact .k{font-size:13px;color:var(--ink-3)}
.fact .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:2px}
.fact .v small{font-size:14px;color:var(--ink-3);font-weight:400}
.signal{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-radius:var(--r-m);padding:12px 16px;background:var(--warn-soft);color:var(--ink-2);font-size:14.5px}
.signal.crit{background:var(--crit-soft)}
.signal .ico{color:var(--warn);width:18px;height:18px}
.signal.crit .ico{color:var(--crit)}
.signal .t{flex:1;min-width:200px}
.signal .t strong{font-weight:600;color:var(--ink)}
.signal .done{font-size:13px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.signal .done .ico{color:var(--good)}
.feed{display:grid}
.ev{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.ev:first-child{border-top:0;padding-top:0}
.ev .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3)}
.ev .dot .ico{width:14px;height:14px}
.ev .tt{font-weight:500}
.ev .meta{font-size:13px;color:var(--ink-3);margin-top:1px}
.ev .meta .crit{color:var(--crit);font-weight:500}
.ev .note{margin-top:4px;color:var(--ink-2);font-size:14px}
.ev .tm{font-size:12px;color:var(--ink-3);white-space:nowrap}
.new-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand);margin-right:7px;vertical-align:2px}
.report{color:var(--ink-2);font-size:14.5px}
.report+.report{border-top:1px solid var(--line);padding-top:14px}
.report .dt{font-size:13px;font-weight:500;color:var(--ink-3);margin-bottom:2px}
textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
textarea::placeholder{color:var(--ink-3)}

/* Schema editor */
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;color:var(--ink-2)}
.days button[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.ex-table{width:100%;border-collapse:collapse}
.ex-wrap{overflow-x:auto}
.ex-table th{text-align:left;font-size:12.5px;color:var(--ink-3);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
.ex-table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.ex-table tbody tr:last-child td{border-bottom:0}
.ex-table input{width:64px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);font-variant-numeric:tabular-nums;text-align:right}
.ex-name{display:flex;gap:10px;align-items:center;font-weight:500;min-width:180px}
.vid-ico{width:26px;height:26px;border-radius:7px;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;flex:none}
.vid-ico .ico{width:11px;height:11px}
.rm{border:0;background:transparent;color:var(--ink-3);font-size:18px;line-height:1;padding:4px 8px;border-radius:6px}
.rm:hover{background:var(--crit-soft);color:var(--crit)}
.block-title{display:flex;align-items:baseline;gap:10px;margin:18px 0 4px}
.block-title:first-of-type{margin-top:0}
.block-title h4{font-size:15px}

/* Charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:8px;padding:6px 9px;font-size:12.5px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-110%);box-shadow:var(--shadow);z-index:2}
.chart .tip b{font-variant-numeric:tabular-nums}
.ex-pick{display:flex;gap:6px;flex-wrap:wrap}
.ex-pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink-2)}
.ex-pick button:hover{background:var(--surface-2)}
.ex-pick button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:600}
.cmp{display:flex;gap:28px;flex-wrap:wrap;align-items:baseline}
.cmp .big{font-weight:600;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.delta{font-size:14px;font-weight:600;color:var(--ink-2)}
.delta.up{color:var(--good)} .delta.down{color:var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-weight:500;color:var(--ink-3);font-size:13px}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}

/* Video */
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.thumb{aspect-ratio:16/10;max-width:100%;border-radius:var(--r-m);background:var(--surface-2);position:relative;display:grid;place-items:center;color:var(--ink-3);overflow:hidden}
.thumb .play{width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);display:grid;place-items:center;color:var(--ink);position:relative}
.thumb .play .ico{width:16px;height:16px}
.thumb .lbl{position:absolute;left:12px;bottom:9px;right:12px;display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:var(--ink-2)}
.thumb .stick{position:absolute;inset:0;opacity:.22}
.vcard{display:grid;gap:10px}
.fb{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink-2)}

/* Chat */
.chat{display:flex;flex-direction:column;gap:10px}
.hours{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px;color:var(--ink-2)}
.hours strong{color:var(--ink);font-weight:600}
.hours .live{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.hours.on .live{background:var(--good)}
.msgs{display:flex;flex-direction:column;gap:8px;padding:6px 0}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;background:var(--surface-2);font-size:14.5px;line-height:1.45}
.msg .mt{display:block;font-size:11px;color:var(--ink-3);margin-top:3px;text-align:right}
.msg.me{align-self:flex-end;background:var(--brand-tint);color:var(--ink);border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;border-bottom-left-radius:5px}
.msg.sys{align-self:center;background:transparent;color:var(--ink-3);font-size:12.5px;text-align:center;max-width:90%;padding:4px 8px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;height:44px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink-2)}
.quick button:hover{background:var(--surface-2)}

/* Library & settings */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.lib .card{padding:12px;display:grid;gap:8px;align-content:start}
.lib ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
.page{padding:28px 28px 48px;overflow:auto;display:grid;gap:20px;align-content:start;grid-column:2 / span 2}
.page h2{font-size:24px}
.hrs{display:grid;gap:6px}
.hr{display:grid;grid-template-columns:110px auto auto auto;gap:10px;align-items:center}
.hr input[type="time"]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px}
.toggle{position:relative;width:42px;height:24px;flex:none}
.toggle input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;border-radius:999px;background:var(--surface-3);transition:background .15s}
.toggle span::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;left:3px;top:3px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.toggle input:checked+span{background:var(--brand)}
.toggle input:checked+span::after{transform:translateX(18px)}
.toggle input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.stories{font-size:12px;color:var(--ink-3);margin:0}
.stories b{font-weight:600}

/* Client (phone) */
.clientview{flex:1;display:grid;grid-template-columns:minmax(0,400px) minmax(0,320px);justify-content:center;gap:48px;padding:28px 16px 48px;align-items:start}
.phone{width:100%;max-width:390px;height:min(820px,calc(100vh - 140px));min-height:600px;background:var(--surface);border:1px solid var(--line);border-radius:40px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 24px 48px rgba(16,24,40,.08);overflow:hidden;display:flex;flex-direction:column;position:relative;justify-self:center;padding-top:8px}
.p-status{height:28px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:12.5px;font-weight:600;background:var(--surface)}
.p-head{background:var(--surface);padding:8px 20px 10px;display:flex;align-items:center;gap:10px;flex:none}
.p-head h2{font-size:26px;font-weight:700}
.p-head .pb{border:0;background:var(--surface-2);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;color:var(--ink);flex:none}
.p-body{flex:1;overflow:auto;padding:6px 16px 24px;display:flex;flex-direction:column;gap:14px;min-height:0}
.p-body>*{flex:none}
.p-nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:8px 4px 14px}
.p-nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink-3);position:relative;padding:4px 0;min-height:44px}
.p-nav button[aria-current="page"]{color:var(--brand);font-weight:600}
.p-nav .ico{width:22px;height:22px}
.p-nav .badge{position:absolute;top:0;right:calc(50% - 22px);height:16px;min-width:16px;font-size:10.5px;padding:0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}

function mkSchema(region){
 return {blocks:[{name:"Oefeningen",items:TPL[region].map(([exId,sets,amount,kg])=>({exId,sets,amount,kg:kg||0}))}]};
}
function prescValue(it){const m=EX[it.exId].metric;return m==="kg"?it.kg:it.amount;}
function genLogs(c,r,weeksAgo,lastAgo,adherence,newCount){
 const logs=[];const start=weeksAgo*7;const items=allItems(c);
 const dates=[];for(let n=start;n>=lastAgo;n--){const d=ago(n);if(c.days.includes(d.getDay())&&(r()<adherence||n===lastAgo))dates.push(d);}
 dates.forEach((d,i)=>{const f=dates.length>1?i/(dates.length-1):1;const values={};
  items.forEach(it=>{const m=EX[it.exId].metric;const target=prescValue(it);let v;
   if(m==="kg"){v=Math.max(.5,Math.round((target*(.65+.35*f)+(r()-.5)*.6)*2)/2);}
   else if(m==="sec"){v=Math.max(3,Math.round(target*(.55+.45*f)+(r()-.5)*3));}
   else{v=Math.max(2,Math.round(target-3+3*f+(r()-.5)*1.4));}
   values[it.exId]=v;});
  const dd=new Date(d);dd.setHours(7+Math.floor(r()*13),Math.floor(r()*4)*15);
  logs.push({id:uid(),date:dd,values,rpe:Math.round(5+r()*3),pain:r()<.55?"minder":"gelijk",note:"",isNew:false});
 });
 for(let i=0;i<newCount&&i<logs.length;i++)logs[logs.length-1-i].isNew=true;
 return logs;
}
function allItems(c){return c.schema.blocks.flatMap(b=>b.items);}

function mkGoals(c,week,weeks){

 ]};

  if(hit){s.done=true;s.doneAt=hit.date;s.by="auto";if(!silent){s.isNew=true;got.push(s);}}});});return got;}

 opt=opt||{};const W=opt.w||640,H=opt.h||230,m={t:14,r:18,b:26,l:38};

 const X=t=>m.l+(t-x0)/((x1-x0)||1)*(W-m.l-m.r);const Y=v=>H-m.b-(v-lo)/((hi-lo)||1)*(H-m.t-m.b);

 libShare(id){const e=EX[id];e.shared=!e.shared;toast(e.shared?`${e.name} is gedeeld met collega's`:`${e.name} is nu privé`);render();},
 libCopy(id){const e=EX[id];const n={...e,id:e.id+"-mijn",name:e.name+" (eigen versie)",owner:"me",shared:false,copyOf:e.id,tips:[...e.tips]};LIB.push(n);EX[n.id]=n;toast(`${e.name} staat nu in je eigen bibliotheek. Pas hem aan zoals jij wilt.`);render();},
 addVid(id){const e=EX[id];e.dur="0:"+(30+Math.floor(Math.random()*25));toast(`Video toegevoegd aan ${e.name} (in dit concept nagebootst)`);render();},
 saveNewEx(){const D=S.modal.d;const name=D.name.trim();if(!name){toast("Geef de oefening een naam");return;}
  const tips=D.tips.split("\n").map(x=>x.trim()).filter(Boolean);const e={id:"x"+uid(),name,metric:D.metric,dur:D.vid==="later"?null:D.vid==="rec"?"0:45":"link",owner:"me",shared:D.share,tips:tips.length?tips:["Uitleg volgt."]};
  LIB.push(e);EX[e.id]=e;S.modal=null;S.f.libTab="mine";toast(D.vid==="later"?`${name} opgeslagen zonder video. Je kunt hem al in schema's gebruiken.`:`${name} opgeslagen`);render();},
 backList(){S.f.showDetail=false;render();},
 ftab(t){S.f.tab=t;if(t==="chat")S._scrollChat=true;render();},
 remind(id){const c=cl(id);c.chat.push({id:uid(),from:"fysio",text:`Hoi ${firstName(c.name)}, ik zag dat je een tijdje niets hebt ingevuld. Lukt het een beetje? Laat even weten hoe het gaat, dan passen we het schema zo nodig aan.`,date:new Date(),clientNew:c.id==="daan"});c.reminded=true;toast(`Herinnering gestuurd aan ${firstName(c.name)}`);render();},
 toggleReport(){S.f.reportOpen=!S.f.reportOpen;S.f.reportDraft="";render();},
 saveReport(){const t=(S.f.reportDraft||"").trim();if(!t){toast("Schrijf eerst een kort verslag");return;}const c=cl(S.f.sel);const int=S.f.reportInternal;
  c.sessions.push({id:uid(),date:new Date(),text:t,by:"Vadim",internal:int,clientNew:!int&&c.id==="daan"});S.f.reportOpen=false;S.f.reportDraft="";S.f.reportInternal=false;
  toast(int?`Intern verslag opgeslagen. ${firstName(c.name)} ziet het niet.`:`Verslag opgeslagen. ${firstName(c.name)} kan het teruglezen.`);render();},
 toggleDay(d){d=+d;const c=cl(S.f.sel);c.days=c.days.includes(d)?c.days.filter(x=>x!==d):[...c.days,d].sort((a,b)=>a-b);toast(`Trainingsdagen bijgewerkt voor ${firstName(c.name)}`);render();},
 rmEx(arg){const [b,i]=arg.split(":").map(Number);const c=cl(S.f.sel);c.schema.blocks[b].items.splice(i,1);if(c.id==="daan")S.c.draft=null;toast("Oefening verwijderd uit het schema");render();},
 openAdd(b){S.modal={type:"add",block:+b};render();},
 closeModal(_,el,e){if(el.dataset.self&&e.target!==el)return;S.modal=null;render();},
 addEx(id){const c=cl(S.f.sel);const e=EX[id];c.schema.blocks[S.modal.block].items.push({exId:id,sets:3,amount:e.metric==="sec"?20:10,kg:e.metric==="kg"?2:0});if(c.id==="daan")S.c.draft=null;S.modal=null;toast(`${e.name} toegevoegd. ${firstName(c.name)} ziet hem meteen.`);render();},
 pickEx(id){S.f.ex=id;render();},
 ptable(v){S.f.table=v==="1";render();},
 sendFb(id){const c=cl(S.f.sel);const v=c.videos.find(x=>x.id===id);const t=(S.f.fb&&S.f.fb[id]||"").trim();if(!t){toast("Schrijf eerst je feedback");return;}v.feedback=t;v.isNew=false;c.chat.push({id:uid(),from:"system",text:`Vadim gaf feedback op je video (${EX[v.exId].name}): ${t}`,date:new Date(),clientNew:c.id==="daan"});toast(`Feedback gestuurd aan ${firstName(c.name)}`);render();},
 quickF(t){S.f.chatDraft=t;render();const el=document.getElementById("fchat");if(el){el.focus();el.setSelectionRange(t.length,t.length);}},
 sendF(){const t=S.f.chatDraft.trim();if(!t)return;const c=cl(S.f.sel);c.chat.push({id:uid(),from:"fysio",text:t,date:new Date(),clientNew:c.id==="daan"});S.f.chatDraft="";S._scrollChat=true;render();},
 libNew(){S.modal={type:"newEx",d:{name:"",metric:"reps",tips:"",vid:"later",link:"",share:S.libOpen}};render();},
 cSheet(v){S.c.sheet=v||null;S.c.pick=null;render();},
 cPickDay(t){S.c.pick=+t;render();},
 cPickSlot(t){S.c.pick=+t;render();},
 cPlanTrain(){if(!S.c.pick){toast("Kies eerst een dag");return;}const d=new Date(S.c.pick);const [h,m]=S.c.trainTime.split(":").map(Number);d.setHours(h,m,0,0);ME().planned.push({date:d});S.c.sheet=null;S.c.pick=null;toast(`Training ingepland op ${fD(d)} om ${fT(d)}. Je krijgt een reminder.`);render();},
 cBook(){if(!S.c.pick){toast("Kies eerst een tijd");return;}const a=bookAppt("daan",new Date(S.c.pick),"client");a.made=new Date();S.c.sheet=null;S.c.pick=null;toast(`Afspraak gemaakt: ${fD(a.date)} om ${fT(a.date)}. Vadim ziet hem in zijn agenda.`);render();},
 // client
 ctab(t){S.c.tab=t;S.c.training=false;S.c.progEx=null;if(t==="chat"){markClientChatRead();S._scrollChat=true;}if(t==="meer"){setTimeout(()=>{ME().sessions.forEach(s=>s.clientNew=false);},0);}render();},
 openTraining(){S.c.training=true;S.c.openEx=0;if(!S.c.draft)initDraft(ME());render();},
 closeTraining(){S.c.training=false;render();},
 openEx(i){i=+i;S.c.openEx=S.c.openEx===i?-1:i;render();},
 pain(v){S.c.draft.pain=v;render();},
 upload(exId){S.c.uploading={exId,p:0};render();const step=()=>{if(!S.c.uploading)return;S.c.uploading.p+=20;if(S.c.uploading.p>=100){const me=ME();me.videos.push({id:uid(),exId,date:new Date(),len:"0:"+(14+Math.floor(Math.random()*20)),isNew:true,feedback:""});S.c.uploading=null;toast("Video verstuurd. Vadim kijkt mee in zijn spreekuur.");render();return;}render();setTimeout(step,260);};setTimeout(step,260);},
 saveTraining(){const me=ME();const D=S.c.draft;const values={};
  allItems(me).forEach(it=>{const m=EX[it.exId].metric;const sets=D.sets[it.exId]||[];if(!sets.length)return;
   const num=x=>parseFloat(String(x).replace(",","."));
   const v=m==="kg"?Math.max(...sets.map(s=>num(s.kg)||0)):Math.max(...sets.map(s=>num(s.v)||0));if(isFinite(v))values[it.exId]=v;});
  me.logs.push({id:uid(),date:new Date(),values,rpe:D.rpe,pain:D.pain,note:D.note.trim(),isNew:true});me.reminded=false;me.handledAt=null;
  const got=evalGoals(me,false);
  S.c.draft=null;S.c.training=false;S.c.tab="vandaag";toast(got.length?`Training opgeslagen. Subdoel gehaald: ${got.map(s=>s.text).join(" en ")}!`:"Training opgeslagen. Vadim ziet hem in zijn overzicht.");render();},
 sendC(){const t=S.c.chatDraft.trim();if(!t)return;const me=ME();me.chat.push({id:uid(),from:"client",text:t,date:new Date(),isNew:true});
  S.c.chatDraft="";if(!hoursOnline())me.chat.push({id:uid(),from:"system",text:`Automatisch antwoord: bedankt voor je bericht. Vadim reageert ${nextHours()}.`,date:new Date()});S._scrollChat=true;render();},
 pProg(id){S.c.progEx=id;render();},
 pProgBack(){S.c.progEx=null;render();}
};
function markClientChatRead(){ME().chat.forEach(m=>{m.clientNew=false;});}

document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const f=A[t.dataset.act];if(f){f(t.dataset.arg,t,e);}});
document.addEventListener("input",e=>{const t=e.target;const k=t.dataset&&t.dataset.in;if(!k)return;
 if(k==="q"){S.f.q=t.value;const pos=t.selectionStart;render();const el=document.getElementById("q");if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(_){}}}
 else if(k==="fchat")S.f.chatDraft=t.value;
 else if(k==="cchat")S.c.chatDraft=t.value;
 else if(k==="report")S.f.reportDraft=t.value;
 else if(k==="note")S.f.noteDraft=t.value;
 else if(k==="libQ"){S.f.libQ=t.value;const pos=t.selectionStart;render();const el=document.getElementById("libq");if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(_){}}}
 else if(k==="subText")S.f.subDraft.text=t.value;
 else if(k==="subTarget")S.f.subDraft.target=t.value;
 else if(k==="nxName"&&S.modal)S.modal.d.name=t.value;
 else if(k==="nxTips"&&S.modal)S.modal.d.tips=t.value;
 else if(k==="nxLink"&&S.modal)S.modal.d.link=t.value;
 else if(k==="fb"){S.f.fb=S.f.fb||{};S.f.fb[t.dataset.id]=t.value;}
 else if(k==="dnote")S.c.draft.note=t.value;
 else if(k==="rpe"){S.c.draft.rpe=+t.value;const lbl=["rust","heel licht","heel licht","licht","licht","gemiddeld","best zwaar","zwaar","heel zwaar","bijna maximaal","maximaal"];document.getElementById("rpeval").textContent=t.value;document.getElementById("rpelbl").textContent=lbl[+t.value];}
 else if(k==="dset"){const s=S.c.draft.sets[t.dataset.ex][+t.dataset.k];s[t.dataset.f]=t.value;}
});
document.addEventListener("change",e=>{const t=e.target;const k=t.dataset&&t.dataset.ch;if(!k)return;
 if(k==="sets"||k==="amount"||k==="kg"){const c=cl(S.f.sel);const it=c.schema.blocks[+t.dataset.b].items[+t.dataset.i];let v=parseFloat(String(t.value).replace(",","."));if(!isFinite(v)||v<0)v=k==="kg"?0:1;it[k]=k==="kg"?Math.round(v*2)/2:Math.max(1,Math.round(v));if(c.id==="daan")S.c.draft=null;toast(`Bijgewerkt. ${firstName(c.name)} ziet het meteen.`);render();}
 else if(k==="hday"){S.hours.days[t.dataset.d]=t.checked;render();}
 else if(k==="hfrom"){if(t.value)S.hours.from=t.value;render();}
 else if(k==="hto"){if(t.value)S.hours.to=t.value;render();}
 else if(k==="inactive"){S.hours.inactive=+t.value;S.clients.forEach(c=>c.expectEvery=S.hours.inactive);render();}
 else if(k==="rem"){S.reminders[t.dataset.k]=t.checked;render();}
 else if(k==="subEx"){S.f.subDraft.exId=t.value;render();}
 else if(k==="libOpen"){S.libOpen=t.checked;toast(t.checked?"Je bibliotheek staat open voor collega's":"Je bibliotheek is nu privé");render();}
 else if(k==="nxMetric"&&S.modal){S.modal.d.metric=t.value;}
 else if(k==="nxVid"&&S.modal){S.modal.d.vid=t.value;render();}
 else if(k==="nxShare"&&S.modal){S.modal.d.share=t.checked;}
 else if(k==="cTrainTime"){if(t.value)S.c.trainTime=t.value;}
 else if(k==="remtime"){if(t.value)S.reminders.time=t.value;toast(`Reminder om ${S.reminders.time} op je trainingsdagen`);}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){if(e.target.id==="fchat"){e.preventDefault();A.sendF();}else if(e.target.id==="cchat"){e.preventDefault();A.sendC();}else if(e.target.id==="inote"){e.preventDefault();A.sendNote();}}
 if(e.key==="Escape"&&S.modal){S.modal=null;render();}});
document.addEventListener("pointermove",onChartMove);
document.addEventListener("pointerleave",onChartLeave,true);
document.addEventListener("pointerout",e=>{if(e.target.classList&&e.target.classList.contains("hit"))onChartLeave(e);});

render();
})();
</script>
</body></html>
